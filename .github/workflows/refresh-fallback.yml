name: refresh (manual fallback)

# Manual fallback for the Claude Code cloud routine. Refreshes star counts from the GitHub API,
# applies the mechanical rules, rebuilds the README and opens a PR. Never pushes to main.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: refresh, validate, build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run scripts/refresh_stars.py
          uv run scripts/validate.py
          uv run scripts/build_readme.py
      - name: open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          BRANCH="bot/fallback-refresh-$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard data/snapshots)" ]; then
            echo "nothing changed"; exit 0
          fi
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: fallback star refresh $DATE"
          git push -u origin "$BRANCH"
          gh pr create --title "chore: fallback star refresh $DATE" \
            --body "Automated star refresh from the manual fallback workflow. Review validate.py output in the job log before merging. Automation never pushes to main." \
            --base main --head "$BRANCH"
